# /etc/nginx/snippets/horus-securite.conf — en-têtes de sécurité HORUS
# connect-src : l'API (même origine), Keycloak (jetons) et le géocodage OSM.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src 'self' https://auth.mairiederouffiac.fr https://nominatim.openstreetmap.org https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.tile.openstreetmap.org https://tile.openstreetmap.org; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://auth.mairiederouffiac.fr; frame-ancestors 'none';" always;
