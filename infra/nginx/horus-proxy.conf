# /etc/nginx/snippets/horus-proxy.conf — reverse-proxy vers l'API HORUS
# X-Forwarded-For est RÉÉCRIT avec l'adresse réelle (comme les autres sites de l'hôte) :
# l'API ne fait confiance qu'aux adresses privées, donc un client ne peut pas choisir la sienne.
proxy_pass         http://127.0.0.1:3110;
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $remote_addr;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
