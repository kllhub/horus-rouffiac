# /etc/nginx/sites-available/horus — HORUS · horus.mairiederouffiac.fr
# Hôte de production (plateforme-commune), nginx 1.24 : « listen … http2 » et non « http2 on; ».
#
# Ordre d'installation (voir docs/DEPLOIEMENT.md, étape 6) :
#   1. ce fichier SANS le bloc 443 (certificat absent → nginx refuserait de démarrer) ;
#   2. sudo certbot certonly --webroot -w /var/www/html -d horus.mairiederouffiac.fr ;
#   3. le fichier complet, puis nginx -t && systemctl reload nginx.
#
# ⚠ Un add_header placé dans un location annule TOUS ceux du server : d'où les include répétés.

limit_req_zone $binary_remote_addr zone=horus_signal:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=horus_api:10m    rate=10r/s;

server {
  listen 80;
  listen [::]:80;
  server_name horus.mairiederouffiac.fr;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name horus.mairiederouffiac.fr;

  ssl_certificate     /etc/letsencrypt/live/horus.mairiederouffiac.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/horus.mairiederouffiac.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  server_tokens off;
  client_max_body_size 64k;
  root /var/www/horus;
  index index.html;

  include /etc/nginx/snippets/horus-securite.conf;

  # ── API HORUS (conteneur horus-api, 127.0.0.1 uniquement) ──────────
  location = /api/public/signalements {
    limit_req zone=horus_signal burst=3 nodelay;
    include /etc/nginx/snippets/horus-proxy.conf;
  }
  location /api/ {
    limit_req zone=horus_api burst=40 nodelay;
    include /etc/nginx/snippets/horus-proxy.conf;
  }

  # ── PWA ────────────────────────────────────────────────────────────
  # sw.js et config.js : jamais en cache HTTP (mise à jour et bascule immédiates).
  location ~ ^/(sw|config)\.js$ {
    include /etc/nginx/snippets/horus-securite.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location ~* \.(png|jpg|svg|ico|woff2?)$ {
    include /etc/nginx/snippets/horus-securite.conf;
    add_header Cache-Control "public, max-age=2592000" always;
  }
  location / {
    include /etc/nginx/snippets/horus-securite.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
