# HORUS — environnement LOCAL complet (poste de développement / recette).
#
#   cd infra && docker compose -f docker-compose.dev.yml up -d --build
#   → PWA      http://localhost:8090      (index, fdo.html, admin.html)
#   → Keycloak http://localhost:8180      (admin / admin, realm « horus »)
#
# Comptes de test créés par dev-comptes.sh (mot de passe : Horus-Test-2026!).
# Rien ici ne doit servir en production : secrets fixes, Keycloak en mode dev.

name: horus-dev

x-api-env: &api-env
  NODE_ENV: development
  DATABASE_URL: postgresql://horus:horus-dev@postgres:5432/horus
  KEYCLOAK_ISSUER_URL: http://localhost:8180/realms/horus
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/horus
  KEYCLOAK_CLIENT_ID: horus-pwa
  KEYCLOAK_ADMIN_CLIENT_ID: horus-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: horus-dev-secret
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      HORUS_URL: http://localhost:8090
      HORUS_ADMIN_SECRET: horus-dev-secret
    volumes:
      - ./keycloak/realm-horus.json:/opt/keycloak/data/import/realm-horus.json:ro
    ports: ["8180:8080"]

  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: horus, POSTGRES_USER: horus, POSTGRES_PASSWORD: horus-dev }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horus -d horus"]
      interval: 3s
      retries: 30

  migrate:
    build: ../api
    image: horus-api:dev
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *api-env
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    image: horus-api:dev
    environment: *api-env
    depends_on: { migrate: { condition: service_completed_successfully } }

  front:
    image: nginx:1.27-alpine
    volumes:
      - ../horus-pwa/horus-pwa:/usr/share/nginx/html:ro
      - ./dev/config.dev.js:/usr/share/nginx/html/config.js:ro
      - ./dev/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    ports: ["8090:80"]
