server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:3000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
