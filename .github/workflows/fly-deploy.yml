# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

# Fly.io sert désormais une DÉMONSTRATION figée de HORUS (config.js = null).
# La production est sur le serveur de la mairie (horus.mairiederouffiac.fr), voir docs/DEPLOIEMENT.md.
# ⛔ Plus de déploiement automatique : lancer ce workflow À LA MAIN (onglet Actions → Run workflow).
name: Fly Deploy (démo, manuel)
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
