server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # sw.js ne doit jamais être mis en cache HTTP
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Assets statiques : cache 1 an
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML et JS : pas de cache navigateur (le SW gère)
    location ~* \.(html|js|json|css)$ {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
